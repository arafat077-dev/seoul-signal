function switchChatClose(){if($('chat').open)$('chat').close()}
function initWelcome(){if(thread.length||$('chat-messages').children.length)return;const hello={title:'What kind of shop are you considering?',paras:['Tell me your product, a district you like, or your weekly costs. I can compare the data and show the evidence behind a scouting visit.'],suggest};put('bot',hello,null,false)}
function setSuggest(s){suggest=s;$('suggestions').innerHTML=s.slice(0,3).map(t=>'<button class="chip" data-act="suggest" data-text="'+E(t)+'">'+E(t)+'</button>').join('')}
function openChat(seed){lastTrigger=D.activeElement;const chat=$('chat');if(!chat.open)chat.showModal();initWelcome();setSuggest(suggest);aiState();if(seed)send(seed);else if(!matchMedia('(max-width:650px)').matches)$('question').focus({preventScroll:true});}
function put(role,data,context,keep=true){const log=$('chat-messages'),el=D.createElement('div');el.className='msg '+role;if(role==='user')el.textContent=data;else{el.innerHTML='<div class="ans"><span class="answer-title">'+E(data.title)+'</span>'+data.paras.map(t=>'<p>'+E(t)+'</p>').join('')+'</div>';if(data.source){const b=D.createElement('button');b.className='answer-source';b.textContent=(data.page==='planner'?'Open this plan · ':data.page==='explore'?'Explore the values · ':'Evidence: ')+data.source;b.addEventListener('click',()=>{switchChatClose();if(data.page==='explore'){const cmp=data.id==='compare'?(context?.second|| (context?.d==='Yongsan-gu'?'Seongdong-gu':'Yongsan-gu')):'none';drill(context?.d||'all',context?.c||'all',cmp)}else if(data.page==='planner'){st.pc=context?.c||'all';st.pd=context?.d||'all';st.sort=context?.sort||'delta';st.planPick='';for(const [k,key] of [['fixed','fixed'],['margin','margin'],['forecast','forecast']])if(context?.[k]!==''&&context?.[k]!=null)st[key]=context[k];go('planner')}else go('evidence')});el.append(b)}}
 log.append(el);log.scrollTop=log.scrollHeight;if(keep)thread.push({role:role==='bot'?'assistant':'user',content:role==='bot'?data.title+' '+data.paras.join(' '):data});return el}

}
async function aiToggle(){const ai=g.SeoulLocalAI;if(!ai?.canUse())return;if(ai.state==='loading'||ai.state==='ready'){++aiJob;await ai.unload();aiState('Using the evidence guide.');return}const job=++aiJob;try{const promise=ai.load(p=>{if(job===aiJob)aiState(p.text+(p.progress>0?' · '+Math.round(p.progress*100)+'%':''))});aiState('Preparing model…');await promise;if(job===aiJob)aiState('Ready. Verified figures still come directly from the data.')}catch(err){if(job===aiJob)aiState('Local AI could not start. The evidence guide is still available.')}}
async function send(txt){txt=String(txt||'').trim().slice(0,1000);if(!txt)return;const myEpoch=++chatEpoch;put('user',txt);$('question').value='';const res=C.decide(txt,ctx);ctx=res.context;const here={...ctx};let ans=res.answer;const ai=g.SeoulLocalAI;const protectedIds=['unsupported','fullplan','units','budget','period','range','drivers','cost','coverage','site','outlier'];
 if(ai?.state==='ready'&&!protectedIds.includes(ans.id)){const holder=D.createElement('div');holder.className='msg bot smallnote';holder.textContent='Reading your plan on this device…';$('chat-messages').append(holder);$('chat-messages').scrollTop=$('chat-messages').scrollHeight;const candidates=[...new Map([ans,...res.cards].map(v=>[v.id,v])).values()];try{const v=await ai.explain({question:txt,history:thread.slice(-5,-1),facts:candidates.map(c=>({id:c.id,label:c.title,text:c.paras.join(' ')}))});const candidate=candidates.find(c=>c.id===v.ids[0]);if(candidate&&ans.id==='clarify'){ans=candidate}else if(candidate&&candidate.id!==ans.id&&ans.id!=='clarify'){ans={...ans,paras:[...ans.paras,'Related evidence: '+candidate.title+' '+candidate.paras[0]]}}}catch(_){aiState('Using the verified evidence guide for this answer.')}finally{holder.remove()}}
 if(myEpoch!==chatEpoch)return;ctx.last=ans.id;put('bot',ans,here);setSuggest(ans.suggest||strongSuggestions);}
const strongSuggestions=['Which district should I visit?','Why not Yongsan?','Test break-even'];
function seedExplore(){ctx={...C.base(),d:st.d,c:st.c,second:st.cmp==='none'?null:st.cmp};openChat(st.cmp==='none'?'Show me the H1 sales change for this selection.':'Compare the two districts.')}
function seedPlan(){ctx={...C.base(),c:st.pc,d:st.pd,sort:st.sort,fixed:st.fixed,margin:st.margin,forecast:st.forecast};openChat('Which site should I visit first for this plan?')}
D.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const k=a.dataset.act;switch(k){
case 'chat':openChat();break;case 'chatClose':switchChatClose();break;case 'suggest':send(a.dataset.text);break;case 'aiLoad':aiToggle();break;
case 'rotateLeft':map?.rotate(-15);break;case 'rotateRight':map?.rotate(15);break;case 'zoomIn':map?.zoom(.14);break;case 'zoomOut':map?.zoom(-.14);break;case 'resetMap':map?.reset();break;case 'mapExplore':drill(st.mapD,st.mapCat);break;
case 'lens':st.lens=a.dataset.v;$('rank-lens').innerHTML=P.lens(st);$('rank-lens').querySelector('[aria-pressed=true]')?.focus({preventScroll:true});break;
case 'drill':drill(a.dataset.d,a.dataset.c);break;case 'explorePlanner':st.pc=st.c;st.pd=st.d;st.planPick='';go('planner');break;case 'exploreAsk':seedExplore();break;case 'plannerAsk':seedPlan();break;
case 'planPick':st.planPick=a.dataset.d+'|'+a.dataset.c;$('plan-result').innerHTML=P.result(st);$('plan-result').querySelector('.choicebutton.sel')?.focus({preventScroll:true});break;
case 'widen':st.pd='all';st.pc='all';st.planPick='';pageRender();break;
case 'csv':B.download('Seoul_Signal_Quarterly_View.csv',B.csv(st,lines()),'text/csv;charset=utf-8');toast('Quarterly view downloaded.');break;
case 'downloadBrief':if(!B.financial(st)||st.forecast!==''&&Number(st.forecast)<0){toast('Complete the weekly cost and margin fields before exporting.');$('fix').focus();break}B.download('Seoul_Signal_Scouting_Brief.html',B.printBrief(st),'text/html;charset=utf-8');toast('Scouting brief downloaded. Open it to print or save a PDF.');break;
case 'proof':{const p=P.proofs[a.dataset.k];if(!p)break;$('proof-title').textContent=p[0];$('proof-img').src=g.SeoulOfflineEvidence?.[a.dataset.k]||'assets/evidence/'+a.dataset.k+'.png';$('proof-img').alt=p[0];$('proof-note').textContent=p[1];$('proof').showModal();break}case 'proofClose':$('proof').close();break}});
